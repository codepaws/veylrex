[workspace]
resolver = "3"
members = [
    "crates/veylrex",
    "crates/llama-cpp-oxide",
    "crates/onnx-oxide",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codepaws/veylrex"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
